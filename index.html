<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="referrer" content="no-referrer-when-downgrade">

  <title>ระบบลงข้อมูลเพื่อจัดทำหนังสือรุ่น หลักสูตร พจน.70 พื้นที่พุทธมณฑล</title>
  <meta name="description" content="ระบบลงข้อมูลเพื่อจัดทำหนังสือรุ่น หลักสูตร พจน.70 พื้นที่พุทธมณฑล">

  <!-- Link preview สำหรับ LINE / Facebook / Messenger -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="ระบบลงข้อมูลเพื่อจัดทำหนังสือรุ่น หลักสูตร พจน.70">
  <meta property="og:description" content="พื้นที่พุทธมณฑล — กรอกข้อมูลเพื่อจัดทำหนังสือรุ่น">
  <!-- แก้เป็น URL GitHub Pages ของคุณ และใส่รูปขนาด 1200x630 (ถ้ามี) -->
  <meta property="og:url" content="https://USERNAME.github.io/REPO/">
  <meta property="og:image" content="https://USERNAME.github.io/REPO/cover.jpg">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e3a8a'/><text x='50' y='66' font-size='46' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>70</text></svg>">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;            /* ไม่มี scrollbar ชั้นนอก */
      background: #ffffff;
      overscroll-behavior: none;   /* กันเด้ง/ดึงรีเฟรชบนมือถือ */
    }

    body {
      height: 100vh;               /* fallback เบราว์เซอร์เก่า */
      height: 100dvh;              /* กัน address bar มือถือบัง */
      /* กันรอยบาก / Home indicator ของ iPhone */
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    #app {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
    }

    /* ---------- Loading screen ---------- */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      font-family: "Sarabun", "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
      transition: opacity .6s ease, visibility .6s ease;
    }
    #loader.hide { opacity: 0; visibility: hidden; pointer-events: none; }

    .spinner {
      width: 56px; height: 56px;
      border: 5px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .title { font-size: clamp(18px, 4.5vw, 24px); font-weight: 700; line-height: 1.5; max-width: 560px; }
    .sub   { font-size: 15px; opacity: .85; }

    #slow { display: none; font-size: 14px; opacity: .95; }
    #slow.show { display: block; }
    #slow a {
      display: inline-block; margin-top: 10px; padding: 10px 20px;
      background: #fff; color: #1e3a8a; border-radius: 999px;
      text-decoration: none; font-weight: 700;
    }
  </style>
</head>
<body>

  <div id="loader" role="status" aria-live="polite">
    <div class="spinner"></div>
    <div class="title">ระบบลงข้อมูลเพื่อจัดทำหนังสือรุ่น<br>หลักสูตร พจน.70 พื้นที่พุทธมณฑล</div>
    <div class="sub">กำลังโหลดระบบ กรุณารอสักครู่...</div>
    <div id="slow">
      อินเทอร์เน็ตอาจช้า หากรอนานเกินไปกดปุ่มด้านล่าง<br>
      <a id="directLink" href="#" target="_blank" rel="noopener">เปิดระบบโดยตรง</a>
    </div>
  </div>

  <iframe
    id="app"
    title="ระบบลงข้อมูลเพื่อจัดทำหนังสือรุ่น หลักสูตร พจน.70"
    allow="fullscreen"
    allowfullscreen
    frameborder="0"
    referrerpolicy="no-referrer-when-downgrade"></iframe>

  <noscript>
    <p style="padding:20px;font-family:sans-serif">
      กรุณาเปิดใช้งาน JavaScript หรือ
      <a href="https://script.google.com/macros/s/AKfycbzlQ-zHlqyg5tWNVLo62YIsop9Lg-OKu3mqsYaiDM6I2pGRq-BwGjnycRcz3cLLFd4/exec">คลิกที่นี่เพื่อเปิดระบบ</a>
    </p>
  </noscript>

  <script>
    (function () {
      // ================= ตั้งค่า =================
      var APP_URL = "https://script.google.com/macros/s/AKfycbzlQ-zHlqyg5tWNVLo62YIsop9Lg-OKu3mqsYaiDM6I2pGRq-BwGjnycRcz3cLLFd4/exec";

      // true = เมื่อเปิดใน LINE จะเด้งไปเปิดใน Safari/Chrome อัตโนมัติ
      // (แนะนำให้เปิดเป็น true ถ้าผู้ใช้ต้องอัปโหลดรูปแล้วเจอปัญหาใน LINE)
      var LINE_OPEN_EXTERNAL = false;

      var SLOW_HINT_MS  = 10000;  // แสดงปุ่มสำรองหลัง 10 วินาที
      var MAX_LOADER_MS = 30000;  // ซ่อน loader แน่นอนหลัง 30 วินาที
      // ===========================================

      var ua = navigator.userAgent || "";
      var params = new URLSearchParams(location.search);

      // LINE: เปิดด้วยเบราว์เซอร์ภายนอก (ยังคงเป็นโดเมนของคุณ)
      if (LINE_OPEN_EXTERNAL && /\bLine\//i.test(ua) && !params.has("openExternalBrowser")) {
        params.set("openExternalBrowser", "1");
        location.replace(location.pathname + "?" + params.toString() + location.hash);
        return;
      }

      // ส่ง query string ต่อให้ GAS (เช่น ?page=form) โดยตัดพารามิเตอร์ของ LINE ออก
      params.delete("openExternalBrowser");
      var qs = params.toString();
      var finalUrl = APP_URL + (qs ? "?" + qs : "");

      var frame  = document.getElementById("app");
      var loader = document.getElementById("loader");
      var slow   = document.getElementById("slow");
      document.getElementById("directLink").href = finalUrl;

      var hidden = false;
      function hideLoader() {
        if (hidden) return;
        hidden = true;
        loader.classList.add("hide");
        setTimeout(function () { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 700);
      }

      frame.addEventListener("load", hideLoader);
      frame.src = finalUrl;   // ผูก event ก่อนแล้วค่อยใส่ src

      setTimeout(function () { if (!hidden) slow.classList.add("show"); }, SLOW_HINT_MS);
      setTimeout(hideLoader, MAX_LOADER_MS);

      // fallback สำหรับ WebView รุ่นเก่าที่ไม่รู้จัก dvh
      if (!(window.CSS && CSS.supports && CSS.supports("height", "100dvh"))) {
        var setH = function () { document.body.style.height = window.innerHeight + "px"; };
        setH();
        window.addEventListener("resize", setH);
        window.addEventListener("orientationchange", setH);
      }
    })();
  </script>
</body>
</html>
